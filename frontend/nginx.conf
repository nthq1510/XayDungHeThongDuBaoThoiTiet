server {
    listen 80;
    server_name localhost;

    # Thư mục chứa các file static đã được build từ React
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Hỗ trợ React Router (fallback về index.html cho các route SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình cache cho các file tĩnh để tăng hiệu năng load trang
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Báo lỗi 404 và chuyển hướng
    error_page 404 /index.html;

    # Bật Gzip nén dữ liệu truyền tải
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";
}
